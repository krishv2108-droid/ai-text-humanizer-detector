[project]
name = "humanizer-detector"
version = "0.1.0"
description = "AI-text detector and humanizer trained as an adversarial loop"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

# Heavy dependencies are optional extras so early milestones install quickly.
#   uv sync --extra data  (pyarrow, to read parquet)
#   uv sync --extra nlp   (spaCy, textstat)
#   uv sync --extra ml    (PyTorch, transformers, sentence-transformers)
#   uv sync --extra llm   (Anthropic SDK)
#   uv sync --extra app   (Streamlit)
[project.optional-dependencies]
data = ["pyarrow>=15"]
nlp = ["spacy>=3.7", "textstat>=0.7"]
ml = ["torch>=2.2", "transformers>=4.40", "datasets>=2.19", "sentence-transformers>=3.0"]
llm = ["anthropic>=0.40"]
app = ["streamlit>=1.35"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
hd = "hd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
