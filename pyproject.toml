[project]
name = "humanizer-detector"
version = "0.1.0"
description = "AI-text detector and humanizer trained as an adversarial loop"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

# Heavy dependencies are optional extras so early milestones install quickly.
#   uv sync --extra data  (pyarrow, to read parquet)
#   uv sync --extra nlp   (spaCy + en_core_web_sm model, textstat)
#   uv sync --extra ml    (PyTorch, transformers)
#   uv sync --extra embed (sentence-transformers, used from M5)
#   uv sync --extra llm   (OpenAI-compatible SDK for Groq, plus the Anthropic SDK)
#   uv sync --extra app   (Streamlit)
[project.optional-dependencies]
data = ["pyarrow>=15"]
nlp = [
    "spacy>=3.8,<3.9",
    "textstat>=0.7",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
ml = ["torch>=2.2", "transformers>=4.40"]
embed = ["sentence-transformers>=3.0"]
llm = ["anthropic>=0.40", "openai>=1.50"]
app = ["streamlit>=1.35"]
local = ["mlx-lm>=0.20"]  # run an open model on Apple silicon (no API key)

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
hd = "hd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/hd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
