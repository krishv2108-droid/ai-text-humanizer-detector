seed: 42

paths:
  raw: data/raw
  processed: data/processed
  splits: data/splits
  results: results
  cache: .cache/llm

splits:
  # Fractions are applied per prompt/topic group, never per text, so a human/AI
  # pair for the same prompt always lands on the same side.
  train: 0.70
  val: 0.15
  test: 0.15

genres: [story, essay, casual]   # email deferred: no clean paired dataset (see DATA_SOURCES.md)

data:
  # Stories: one human story per WritingPrompts prompt, one LLM-written story to be generated for it.
  # Prompts are ordered by a stable hash, so raising story_pairs later only appends new ones.
  story_pairs: 300
  story_words: [200, 600]      # keep human stories in this range (also bounds generation cost)
  story_length_scale: 0.8      # ask the LLM for this fraction of the human length; it overshoots word targets
  min_words: 25                # minimum words for HC3 answers
  # HC3 pairs (1 human + 1 ChatGPT answer per question) kept per source file.
  pairs_per_source:
    open_qa: 400
    finance: 400
    medicine: 400
    wiki_csai: 400
    reddit_eli5: 1000

llm:
  # Free-tier Groq. Limits are small (tokens per minute and per day), so every call is cached, batch jobs
  # are resumable, and `hd llm check` reports your account's real limits. Switch provider to "anthropic"
  # (and models to claude-* ids) if you ever use an Anthropic key.
  provider: groq
  generation_model: openai/gpt-oss-120b   # writes the AI side of the story pairs
  humanizer_model: openai/gpt-oss-120b    # rewrites AI text
  generation_effort: low     # only used by reasoning models such as openai/gpt-oss-120b (low|medium|high)
  humanizer_effort: low
  generation_max_tokens: 2000 # ceiling; each story's budget is derived from its target length
  max_retries: 6              # SDK retries 429/5xx using the provider's retry-after
  min_interval_s: 2.0         # spacing between requests (guards the per-minute request limit)
  reasoning_headroom: 1500    # extra completion tokens for reasoning models' hidden thinking
  cache: true

loop:
  max_iterations: 4
  # "Flagged" means above the frozen 5%-false-positive cutoff for that detector and genre
  # (results/detector_thresholds.json, from `hd detector eval-external`), never a fixed 0.5.
  # Every draft gets at least one rewrite, even one our detector already passes (the independent detector
  # may still flag it, and the humanizer is what is being evaluated).

guardrails:
  # Provisional. `hd humanizer calibrate-guardrails` simulates failures (see results/guardrail_calibration.csv);
  # false-positive rates on REAL rewrites are unmeasured until an API key is available.
  min_doc_similarity: 0.80   # whole-text embedding similarity to the original
  dropped_sim: 0.50          # original sentence with no rewrite sentence above this = dropped
  max_dropped_frac: 0.20
  invented_sim: 0.35         # rewrite sentence with no original sentence above this = invented
  max_invented_frac: 0.35
  length_ratio: [0.7, 1.4]   # the prompt asks for roughly the same length (+/-20%)
  # Reading level: a rewrite must fall inside the span of real human text of its genre (these percentiles of
  # TRAIN-split human texts). The old rule, "grade may not move more than 3", blocked legitimate humanizing
  # (AI stories read at grade ~8, human ~5), so max_fk_delta is now only the fallback when no human data exists.
  fk_percentiles: [1, 99]
  max_fk_delta: 3.0
  # Rewrite strength = an operating point on the fidelity/evasion trade-off (reports/FINDINGS.md). It changes BOTH what the prompt asks
  # for and which guardrail limits apply. Numbers and names, typos, reading level and length are checked identically in every mode.
  strengths:
    faithful: {min_doc_similarity: 0.80, max_dropped_frac: 0.20}   # keep every sentence's content
    strong:   {min_doc_similarity: 0.72, max_dropped_frac: 0.30}   # may compress or drop minor descriptive detail
  max_novel_rare_rate: 0.01  # share of words that are both new and rare (typo/gibberish signal)
  max_missing_name_frac: 0.25  # share of the original's names that may vanish (any lost number is flagged)
